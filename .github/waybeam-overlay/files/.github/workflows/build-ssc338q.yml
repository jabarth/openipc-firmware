name: Build SSC338Q Firmware

# Custom Waybeam build. This fork is a FREE-STANDING overlay on top of
# upstream OpenIPC/firmware: every run re-checks out upstream `master` HEAD
# and re-applies the durable Waybeam delta (.github/waybeam-overlay/), so the
# fork tracks upstream forever without bit-rotting into a frozen snapshot.
# See .github/waybeam-overlay/README.md for the design and refresh procedure.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'OpenIPC/firmware ref to build on top of (default: master)'
        required: false
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:

      # We need THIS repo only to read the overlay (files/ + patches/ +
      # apply.sh). The actual firmware source comes from upstream below.
      - name: Checkout fork (overlay + patches)
        uses: actions/checkout@v4

      - name: Resolve upstream ref
        id: up
        run: |
          REF="${{ inputs.upstream_ref || 'master' }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # Fetch upstream at the chosen ref into `firmware/`, isolated from the
      # overlay checkout, so the overlay dir + upstream tree never collide.
      - name: Checkout upstream OpenIPC/firmware
        run: |
          REF="${{ steps.up.outputs.ref }}"
          set -euo pipefail
          mkdir -p firmware
          cd firmware
          git init -q
          git remote add upstream https://github.com/OpenIPC/firmware.git
          git fetch --depth=1 upstream "$REF"
          git checkout -q FETCH_HEAD
          UP_SHA=$(git rev-parse HEAD)
          UP_SHORT=$(git rev-parse --short HEAD)
          echo "upstream_sha=$UP_SHA"     >> "$GITHUB_ENV"
          echo "upstream_short=$UP_SHORT" >> "$GITHUB_ENV"
          echo "## upstream: $UP_SHORT ($UP_SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "Building Waybeam on top of upstream $UP_SHORT"
          # Commit the pristine upstream snapshot so `git apply --3way` has a
          # real index to reconcile patches against. Nobody publishes this
          # throwaway commit; throwaway branch, deleted at run end.
          git config user.email "waybeam@ci"
          git config user.name  "waybeam-ci"
          # allow-empty: a fresh `--depth=1` checkout is already clean, so
          # `git add -A` produces no diff. The commit only exists to give
          # `git apply --3way` an index to reconcile patches against; the
          # content is identical whether it is empty or not.
          git add -A && git commit --allow-empty -q -m "upstream snapshot"

      - name: Apply Waybeam overlay
        run: |
          bash ./.github/waybeam-overlay/apply.sh "$(pwd)/firmware"

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo CACHE_DATE=$(date +%m) >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: /tmp/ccache
          key: ssc338q_ultimate-${{ env.CACHE_DATE }}

      - name: Restore ccache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ssc338q_ultimate-${{ env.CACHE_DATE }}

      - name: Setup dl cache
        uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: firmware/output/dl
          key: dl-ssc338q_ultimate-${{ env.CACHE_DATE }}
          restore-keys: dl-ssc338q_ultimate-

      - name: Restore dl cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: firmware/output/dl
          key: dl-ssc338q_ultimate-${{ env.CACHE_DATE }}
          restore-keys: dl-ssc338q_ultimate-

      # The dl cache holds moving-ref tarballs (majestic upstream, etc.) under
      # a constant filename. The cache only saves on a key miss, so the snapshot
      # freezes for weeks; buildroot then reuses stale bytes and ships old bits.
      # Drop the moving-ref forms so buildroot re-fetches each run.
      - name: Refresh moving-ref package downloads
        run: |
          find firmware/output/dl -type f -regextype posix-extended \
            -regex '.*[-.](HEAD|master|main|dist)\.tar\.(gz|bz2|xz)' \
            -print -delete 2>/dev/null || true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget cpio unzip rsync bc \
            python3 python3-pip libncurses5-dev libssl-dev device-tree-compiler \
            u-boot-tools xz-utils

      - name: Build firmware
        run: |
          mkdir -p /tmp/ccache
          ln -s /tmp/ccache "$HOME/.ccache"
          cd firmware
          export GIT_HASH="${{ env.upstream_short }}"
          export GIT_BRANCH="upstream/${{ steps.up.outputs.ref }}"
          make BOARD=ssc338q_ultimate all

      - name: Verify kernel modules
        run: sh .github/scripts/check_target_modules.sh
        working-directory: firmware
        continue-on-error: true

      - name: Locate artifacts
        id: art
        run: |
          NORFW=$(find firmware/output/images -name 'openipc*nor*' | head -1)
          [ -n "$NORFW" ] && echo "norfw=$NORFW" >> "$GITHUB_OUTPUT"
          TGZ=$(find firmware/output/images -name 'openipc*.tgz' | head -1)
          [ -n "$TGZ" ]  && echo "tgz=$TGZ"     >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openipc-waybeam-firmware
          if-no-files-found: warn
          retention-days: 14
          path: |
            firmware/output/images/openipc*.tgz
            firmware/output/images/openipc*nor*
            firmware/output/images/openipc*nand*

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.art.outputs.tgz
        uses: softprops/action-gh-release@v2
        with:
          name: Waybeam Custom Firmware (Build ${{ github.run_number }})
          tag_name: build-${{ github.run_number }}
          files: |
            ${{ steps.art.outputs.tgz }}
            ${{ steps.art.outputs.norfw }}
          generate_release_notes: true
          body: |
            ## Waybeam custom SSC338Q ultimate firmware
            **Upstream ref:** `${{ steps.up.outputs.ref }}` @ `${{ env.upstream_short }}`
            **Upstream SHA:** `${{ env.upstream_sha }}`
            **Build run:** `${{ github.run_number }}`

            ⚠️ **10MB rootfs — flashing prerequisite.** See README-Waybeam.md before flashing.
