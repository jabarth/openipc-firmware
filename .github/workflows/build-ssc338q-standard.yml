name: Build SSC338Q WFB-ng (majestic + wfb-ng + OpenHD 8812cu_ohd)

# SSC338Q image for the Emax Wyvern Link VTX: upstream majestic build PLUS the
# wfb-ng stack (wifibroadcast-ng, adaptive-link, msposd, mavlink-router,
# i2c-telemetry), the OpenHD rtl88x2cu driver (8812cu_ohd.ko for 0bda:c812),
# the bl-r8812cu adapter profile, /etc/modules with cfg80211, and the
# proven S98wifibroadcast init script. 10MB rootfs to fit everything.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'OpenIPC/firmware ref to build on top of (default: master)'
        required: false
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:

      - name: Checkout fork (overlay + patches)
        uses: actions/checkout@v4

      - name: Resolve upstream ref
        id: up
        run: |
          REF="${{ inputs.upstream_ref || 'master' }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream OpenIPC/firmware
        run: |
          REF="${{ steps.up.outputs.ref }}"
          set -euo pipefail
          mkdir -p firmware
          cd firmware
          git init -q
          git remote add upstream https://github.com/OpenIPC/firmware.git
          git fetch --depth=1 upstream "$REF"
          git checkout -q FETCH_HEAD
          UP_SHA=$(git rev-parse HEAD)
          UP_SHORT=$(git rev-parse --short HEAD)
          echo "upstream_sha=$UP_SHA"     >> "$GITHUB_ENV"
          echo "upstream_short=$UP_SHORT" >> "$GITHUB_ENV"
          echo "## upstream: $UP_SHORT ($UP_SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "Building Standard (majestic + rtl88x2cu + 10MB rootfs) on top of upstream $UP_SHORT"
          git config user.email "standard@ci"
          git config user.name  "standard-ci"
          git add -A && git commit --allow-empty -q -m "upstream snapshot"

      # Apply 10MB rootfs patch (same as Waybeam build)
      - name: Apply 10MB rootfs patch
        run: |
          cd firmware
          sed -i 's/rootfs.squashfs,8192,nor/rootfs.squashfs,10240,nor/g' Makefile

      # Inject wfb-ng overlay: OpenHD driver, proven init script, adapter profile, /etc/modules
      - name: Inject wfb-ng overlay (driver + packages + init + configs)
        run: |
          set -euo pipefail
          cd firmware
          OVL=../.github/waybeam-overlay/files/general/package

          # rtl88x2cu package (OpenHD 73f36ba -> 88x2cu_ohd.ko + symlinks)
          cp -r "$OVL/rtl88x2cu" general/package/
          sed -i '/rtl88x2eu-openipc\/Config.in/a source "$BR2_EXTERNAL_GENERAL_PATH\/package\/rtl88x2cu\/Config.in"' general/package/Config.in

          # wifibroadcast-ng: our proven init script (0bda:c812 -> 8812cu_ohd,
          # insmod cfg80211-first) + /etc/modules (cfg80211) + modprobe.d note
          mkdir -p general/package/wifibroadcast-ng/files/etc/modprobe.d
          cp "$OVL/wifibroadcast-ng/files/wifibroadcast" general/package/wifibroadcast-ng/files/wifibroadcast
          cp "$OVL/wifibroadcast-ng/files/wfb.yaml" general/package/wifibroadcast-ng/files/wfb.yaml
          cp "$OVL/wifibroadcast-ng/files/etc/modprobe.d/blacklist-88x2cu.conf" general/package/wifibroadcast-ng/files/etc/modprobe.d/blacklist-88x2cu.conf
          # /etc/modules (cfg80211) is installed by rtl88x2cu.mk itself
          # adaptive-link: overwrite mk + yaml in place (Config.in already sources it at line 1)
          cp -r "$OVL/adaptive-link/." general/package/adaptive-link/

          # defconfig: driver + full wfb-ng stack (majestic stays ON)
          DEFCFG=br-ext-chip-sigmastar/configs/ssc338q_ultimate_defconfig
          sed -i '/BR2_PACKAGE_RTL8733BU_OPENIPC=y/a BR2_PACKAGE_RTL88X2CU=y' "$DEFCFG"
          cat >> "$DEFCFG" <<'EOF'
          BR2_PACKAGE_WIFIBROADCAST_NG=y
          BR2_PACKAGE_ADAPTIVE_LINK=y
          BR2_PACKAGE_MSPOSD=y
          BR2_PACKAGE_I2C_TELEMETRY=y
          BR2_PACKAGE_MAVLINK_ROUTER=y
          EOF

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo CACHE_DATE=$(date +%m) >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: /tmp/ccache
          key: ssc338q_standard-${{ env.CACHE_DATE }}

      - name: Restore ccache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ssc338q_standard-${{ env.CACHE_DATE }}

      - name: Setup dl cache
        uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: firmware/output/dl
          key: dl-ssc338q_standard-${{ env.CACHE_DATE }}
          restore-keys: dl-ssc338q_standard-

      - name: Restore dl cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: firmware/output/dl
          key: dl-ssc338q_standard-${{ env.CACHE_DATE }}
          restore-keys: dl-ssc338q_standard-

      - name: Refresh moving-ref package downloads
        run: |
          find firmware/output/dl -type f -regextype posix-extended \
            -regex '.*[-.](HEAD|master|main|dist)\.tar\.(gz|bz2|xz)' \
            -print -delete 2>/dev/null || true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget cpio unzip rsync bc \
            python3 python3-pip libncurses5-dev libssl-dev device-tree-compiler \
            u-boot-tools xz-utils

      - name: Build firmware
        run: |
          mkdir -p /tmp/ccache
          ln -s /tmp/ccache "$HOME/.ccache"
          cd firmware
          export GIT_HASH="${{ env.upstream_short }}"
          export GIT_BRANCH="upstream/${{ steps.up.outputs.ref }}"
          make BOARD=ssc338q_ultimate all

      # MANDATORY artifact gate: unpack the tgz rootfs and fail the build if any
      # required wfb-ng element is missing. Prevents publishing a broken image.
      - name: Verify rootfs contains wfb-ng stack (mandatory)
        run: |
          set -euo pipefail
          cd firmware
          TGZ=$(find output/images -name 'openipc*.tgz' | head -1)
          [ -n "$TGZ" ] || { echo "::error::no openipc tgz artifact produced"; exit 1; }
          rm -rf /tmp/rootfs_check && mkdir -p /tmp/rootfs_check
          tar -xzf "$TGZ" -C /tmp/rootfs_check
          # locate squashfs rootfs image inside the tgz
          SQ=$(find /tmp/rootfs_check -name '*.squashfs' | grep -v md5sum | head -1)
          [ -n "$SQ" ] || { echo "::error::no squashfs found in tgz"; exit 1; }
          rm -rf /tmp/rootfs && mkdir -p /tmp/rootfs
          unsquashfs -d /tmp/rootfs "$SQ" > /dev/null
          fail=0
          check() { if [ -e "/tmp/rootfs$1" ]; then echo "OK   $1"; else echo "::error::MISSING $1"; fail=1; fi; }
          check_grep() { if grep -q "$2" "/tmp/rootfs$1" 2>/dev/null; then echo "OK   $1 ~ $2"; else echo "::error::MISSING $1 contains '$2'"; fail=1; fi; }
          MODDIR=$(ls -d /tmp/rootfs/lib/modules/*/ 2>/dev/null | head -1 | sed 's|/tmp/rootfs||')
          check "${MODDIR}/extra/8812cu_ohd.ko"
          check "${MODDIR}/extra/88x2cu_ohd.ko"
          check /etc/init.d/S98wifibroadcast
          check /etc/init.d/S95majestic
          check /etc/wfb.yaml
          check /etc/wlan_adapters.yaml
          check_grep /etc/modules "cfg80211"
          check_grep /usr/bin/wifibroadcast "0bda:c812"
          check_grep /usr/bin/wifibroadcast "8812cu_ohd.ko"
          check_grep /usr/bin/wifibroadcast "bl-r8812cu"
          check_grep /etc/wfb.yaml "ttyS3"
          check_grep /etc/wlan_adapters.yaml "bl-r8812cu"
          check_grep "${MODDIR}/modules.dep" "8812cu_ohd.ko"
          [ $fail -eq 0 ] || { echo "::error::rootfs missing required wfb-ng elements; refusing to publish"; exit 1; }
          echo "== rootfs wfb-ng gate PASSED =="
      - name: Locate artifacts
        id: art
        run: |
          NORFW=$(find firmware/output/images -name 'openipc*nor*' | head -1)
          [ -n "$NORFW" ] && echo "norfw=$NORFW" >> "$GITHUB_OUTPUT"
          TGZ=$(find firmware/output/images -name 'openipc*.tgz' | head -1)
          [ -n "$TGZ" ]  && echo "tgz=$TGZ"     >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openipc-standard-firmware
          if-no-files-found: warn
          retention-days: 14
          path: |
            firmware/output/images/openipc*.tgz
            firmware/output/images/openipc*nor*
            firmware/output/images/openipc*nand*

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.art.outputs.tgz
        uses: softprops/action-gh-release@v2
        with:
          name: Standard SSC338Q Firmware + rtl88x2cu (Build ${{ github.run_number }})
          tag_name: standard-build-${{ github.run_number }}
          files: |
            ${{ steps.art.outputs.tgz }}
            ${{ steps.art.outputs.norfw }}
          generate_release_notes: true
          body: |
            ## Standard SSC338Q ultimate firmware + rtl88x2cu
            **Upstream ref:** `${{ steps.up.outputs.ref }}` @ `${{ env.upstream_short }}`
            **Upstream SHA:** `${{ env.upstream_sha }}`
            **Build run:** `${{ github.run_number }}`

            This is the standard OpenIPC majestic-based build with the rtl88x2cu Wi-Fi driver added for Emax Wyvern Link VTX.
            Includes 10MB rootfs (expanded from 8MB) to accommodate the extra driver.
